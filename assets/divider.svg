<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0052d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="shimmer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Line -->
  <line x1="0" y1="3" x2="1200" y2="3" stroke="url(#dividerGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shimmering Light Pulse -->
  <circle cy="3" r="3.5" fill="url(#shimmer)">
    <animate attributeName="cx" values="0;1200" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
